<template>
    <lightning-card title="Care journey path" icon-name="standard:record_update">
        <template lwc:if={journeyCard}>
            <div class="slds-p-around_medium">
                <p class="slds-text-heading_small">{patientName}</p>
                <p>Current status: <strong>{statusText}</strong></p>
                <p>Next due: <strong>{journeyCard.nextDueDate}</strong></p>
                <p>Open safety cases: <strong>{journeyCard.openSafetyCases}</strong></p>
            </div>
        </template>
        <template lwc:elseif={error}>
            <div class="slds-p-around_medium slds-text-color_error" role="alert">
                Unable to load care journey details.
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-around_medium slds-text-color_weak">No journey data is available.</div>
        </template>
    </lightning-card>
</template>
